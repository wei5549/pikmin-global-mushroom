<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pikmin 全球大菇雷達</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d1117;
  color:white;
  font-family:Arial,"Noto Sans TC",sans-serif;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px;
}

h1{
  font-size:28px;
  margin:5px 0;
}

.sub{
  color:#9da7b3;
  margin:8px 0 18px;
  line-height:1.5;
}

.box{
  background:#161b22;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid #30363d;
}

input,
select,
button{
  width:100%;
  padding:13px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #444;
  background:#0d1117;
  color:white;
  font-size:16px;
}

button{
  background:#1976d2;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
}

.check input{
  width:auto;
  transform:scale(1.2);
}

#status{
  margin-top:10px;
  color:#aaa;
  line-height:1.5;
}

.summary{
  font-size:18px;
  font-weight:bold;
}

.card{
  background:#161b22;
  border:1px solid #30363d;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
}

.name{
  font-size:23px;
  font-weight:bold;
  margin-bottom:10px;
}

.people{
  font-size:19px;
  font-weight:bold;
  background:#222b36;
  padding:11px;
  border-radius:9px;
  margin:10px 0;
}

.info{
  margin:7px 0;
  color:#ddd;
  line-height:1.5;
}

.fresh{
  color:#79e08f;
}

.old{
  color:#ffb454;
}

.veryold{
  color:#ff7b72;
}

.warning{
  margin-top:9px;
  padding:8px;
  border-radius:8px;
  background:#352a16;
  color:#ffd27a;
}

.map{
  display:inline-block;
  margin-top:10px;
  padding:10px 13px;
  background:#1976d2;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<main>

<h1>🍄 全球大菇雷達</h1>

<div class="sub">
公開掃描資料・只顯示 Level 3 大菇<br>
戰鬥人數為「最後一次掃描時」的紀錄，不代表遊戲目前即時人數。
</div>


<div class="box">

<input
  id="search"
  type="text"
  placeholder="🔎 搜尋國家、城市"
>


<select id="type">

<option value="">
🍄 全部大菇
</option>

</select>


<select id="age">

<option value="0">
🕒 全部掃描時間
</option>

<option value="10">
🟢 10 分鐘內
</option>

<option value="30">
🟢 30 分鐘內
</option>

<option value="60">
🕒 1 小時內
</option>

<option value="180">
🕒 3 小時內
</option>

<option value="1440">
📅 24 小時內
</option>

</select>


<select id="sort">

<option value="new">
🕒 最新掃描時間
</option>

<option value="people">
👥 戰鬥人數最少
</option>

<option value="peopleHigh">
👥 戰鬥人數最多
</option>

</select>


<label class="check">

<input
  id="join"
  type="checkbox"
  checked
>

只顯示最後掃描時還能加入

</label>


<button id="reload">
🔄 重新抓取資料
</button>


<div id="status">
準備抓取資料...
</div>

</div>


<div id="result"></div>


</main>


<script>


var API =
"https://late-glade-6923.awho86958.workers.dev";


var mushrooms = [];


/*
大菇種類名稱
*/

var names = {

2:"🔴 大紅菇",

3:"🩶 大灰菇",

5:"🔵 大藍菇",

6:"🟡 大黃菇",

7:"⚪ 大白菇",

8:"🟣 大紫菇",

9:"🌸 大粉菇",

11:"🔥 大火菇",

12:"💧 大水菇",

13:"💎 大水晶菇",

17:"⚡ 大電菇",

18:"☠️ 大毒菇",

26:"🧊 大冰藍菇"

};



function esc(v){

  var d =
  document.createElement("div");

  d.textContent =
  String(
    v == null ? "" : v
  );

  return d.innerHTML;

}



function findMushrooms(obj,out){

  if(!obj){
    return;
  }


  if(Array.isArray(obj)){

    obj.forEach(function(x){

      findMushrooms(
        x,
        out
      );

    });

    return;

  }


  if(typeof obj !== "object"){
    return;
  }


  if(
    obj.level !== undefined &&
    obj.type !== undefined &&
    obj.lat !== undefined &&
    obj.lng !== undefined
  ){

    out.push(obj);

    return;

  }


  Object.keys(obj).forEach(
    function(k){

      findMushrooms(
        obj[k],
        out
      );

    }
  );

}



function getPeople(x){

  return Number(

    x.challenger_count ??

    x.participant_count ??

    x.participants ??

    0

  );

}



function getCapacity(x){

  return Number(

    x.challenger_capacity ??

    x.max_participants ??

    x.capacity ??

    0

  );

}



function getScanTime(x){

  return Number(

    x.last_observed_at ??

    x.last_seen ??

    x.discovered_at ??

    0

  );

}



function getName(x){

  var t =
  Number(x.type);


  if(names[t]){

    return names[t];

  }


  return "🍄 大菇 Type " + t;

}



function toMilliseconds(v){

  var n =
  Number(v);


  if(!n){
    return 0;
  }


  if(n < 100000000000){

    n = n * 1000;

  }


  return n;

}



function timeText(v){

  var n =
  toMilliseconds(v);


  if(!n){

    return "未知";

  }


  var d =
  new Date(n);


  if(isNaN(d.getTime())){

    return "未知";

  }


  return d.toLocaleString(

    "zh-TW",

    {
      hour12:false
    }

  );

}



function minutesOld(v){

  var n =
  toMilliseconds(v);


  if(!n){

    return Infinity;

  }


  return (
    Date.now() - n
  ) / 60000;

}



function ageText(v){

  var m =
  minutesOld(v);


  if(!isFinite(m)){

    return "時間未知";

  }


  if(m < 1){

    return "不到 1 分鐘前";

  }


  if(m < 60){

    return (
      Math.floor(m) +
      " 分鐘前"
    );

  }


  if(m < 1440){

    return (
      Math.floor(m / 60) +
      " 小時前"
    );

  }


  return (
    Math.floor(m / 1440) +
    " 天前"
  );

}



function ageClass(v){

  var m =
  minutesOld(v);


  if(m <= 30){

    return "fresh";

  }


  if(m <= 180){

    return "old";

  }


  return "veryold";

}



function buildTypeMenu(){

  var select =
  document.getElementById(
    "type"
  );


  var current =
  select.value;


  var types = [];


  mushrooms.forEach(
    function(x){

      var t =
      Number(x.type);


      if(
        types.indexOf(t) === -1
      ){

        types.push(t);

      }

    }
  );


  types.sort(
    function(a,b){

      return a-b;

    }
  );


  select.innerHTML =
  '<option value="">🍄 全部大菇</option>';


  types.forEach(
    function(t){

      var option =
      document.createElement(
        "option"
      );


      option.value =
      String(t);


      option.textContent =
      names[t] ||
      (
        "🍄 大菇 Type " +
        t
      );


      select.appendChild(
        option
      );

    }
  );


  select.value =
  current;

}



function load(){

  var status =
  document.getElementById(
    "status"
  );


  var button =
  document.getElementById(
    "reload"
  );


  status.textContent =
  "正在抓取全球大菇資料...";


  button.disabled =
  true;


  fetch(

    API +
    "?t=" +
    Date.now()

  )


  .then(
    function(r){


      if(!r.ok){

        throw new Error(
          "HTTP " +
          r.status
        );

      }


      return r.json();

    }
  )


  .then(
    function(data){


      var found = [];


      findMushrooms(
        data,
        found
      );


      var seen = {};


      mushrooms =
      found.filter(
        function(x){


          /*
          Level 3 = 大菇
          */

          if(
            Number(x.level) !== 3
          ){

            return false;

          }


          var key =
          String(

            x.id ||

            (
              x.lat +
              "|" +
              x.lng +
              "|" +
              x.type
            )

          );


          if(seen[key]){

            return false;

          }


          seen[key] =
          true;


          return true;

        }
      );


      buildTypeMenu();


      status.textContent =

      "抓取成功：API 共讀到 " +

      found.length +

      " 筆，目前共有 " +

      mushrooms.length +

      " 個 Level 3 大菇";


      render();

    }
  )


  .catch(
    function(err){


      status.textContent =

      "讀取失敗：" +

      err.message;

    }
  )


  .finally(
    function(){


      button.disabled =
      false;

    }
  );

}



function render(){

  var q =

  document
  .getElementById("search")
  .value
  .trim()
  .toLowerCase();



  var selectedType =

  document
  .getElementById("type")
  .value;



  var maxAge =

  Number(

    document
    .getElementById("age")
    .value

  );



  var onlyJoinable =

  document
  .getElementById("join")
  .checked;



  var sort =

  document
  .getElementById("sort")
  .value;



  var list =

  mushrooms.filter(
    function(x){


      if(

        selectedType &&

        String(x.type) !==
        selectedType

      ){

        return false;

      }



      var country =

      x.location_country ||

      x.country ||

      "";



      var city =

      x.location_city ||

      x.city ||

      "";



      var text =

      (

        country +

        " " +

        city +

        " " +

        getName(x)

      ).toLowerCase();



      if(

        q &&

        text.indexOf(q) === -1

      ){

        return false;

      }



      var scanTime =
      getScanTime(x);



      if(maxAge > 0){

        var old =
        minutesOld(
          scanTime
        );


        if(old > maxAge){

          return false;

        }

      }



      if(onlyJoinable){

        var people =
        getPeople(x);


        var max =
        getCapacity(x);


        if(

          max > 0 &&

          people >= max

        ){

          return false;

        }

      }


      return true;

    }
  );



  if(sort === "people"){

    list.sort(
      function(a,b){

        return (

          getPeople(a) -

          getPeople(b)

        );

      }
    );

  }


  else if(
    sort === "peopleHigh"
  ){

    list.sort(
      function(a,b){

        return (

          getPeople(b) -

          getPeople(a)

        );

      }
    );

  }


  else{

    list.sort(
      function(a,b){

        return (

          getScanTime(b) -

          getScanTime(a)

        );

      }
    );

  }



  var result =
  document.getElementById(
    "result"
  );



  result.innerHTML =

  '<div class="box summary">' +

  '🍄 目前符合條件：' +

  list.length +

  ' 個大菇' +

  '</div>';



  if(list.length === 0){

    result.innerHTML +=

    '<div class="box">' +

    '目前沒有符合條件的大菇。' +

    '</div>';


    return;

  }



  list
  .slice(0,300)
  .forEach(
    function(x){


      var people =
      getPeople(x);


      var max =
      getCapacity(x);


      var peopleText;


      if(max > 0){

        peopleText =

        people +

        " / " +

        max;

      }

      else{

        peopleText =
        String(people);

      }



      var country =

      x.location_country ||

      x.country ||

      "";



      var city =

      x.location_city ||

      x.city ||

      "";



      var location =

      (

        country +

        " " +

        city

      ).trim();



      if(!location){

        location =
        "位置未知";

      }



      var scanTime =
      getScanTime(x);



      var old =
      minutesOld(
        scanTime
      );



      var gps =

      Number(x.lat) +

      "," +

      Number(x.lng);



      var map =

      "https://www.google.com/maps?q=" +

      encodeURIComponent(
        gps
      );



      var warning =
      "";


      if(old > 60){

        warning =

        '<div class="warning">' +

        '⚠️ 此資料已超過 1 小時，戰鬥人數可能已經改變。' +

        '</div>';

      }



      var card =

      document.createElement(
        "div"
      );


      card.className =
      "card";



      card.innerHTML =


      '<div class="name">' +

      esc(
        getName(x)
      ) +

      '</div>' +


      '<div class="people">' +

      '👥 最後掃描戰鬥人數：' +

      esc(
        peopleText
      ) +

      '</div>' +


      '<div class="info">' +

      '📍 ' +

      esc(
        location
      ) +

      '</div>' +


      '<div class="info">' +

      '⚔️ 總戰力：' +

      esc(
        x.total_power || 0
      ) +

      '</div>' +


      '<div class="info ' +

      ageClass(
        scanTime
      ) +

      '">' +

      '🔄 最新掃描時間：' +

      esc(
        timeText(
          scanTime
        )
      ) +

      '</div>' +


      '<div class="info ' +

      ageClass(
        scanTime
      ) +

      '">' +

      '⏱️ ' +

      esc(
        ageText(
          scanTime
        )
      ) +

      '</div>' +


      warning +


      '<div class="info">' +

      '📌 GPS：' +

      esc(
        gps
      ) +

      '</div>' +


      '<a class="map" href="' +

      esc(
        map
      ) +

      '" target="_blank" ' +

      'rel="noopener noreferrer">' +

      '📍 Google 地圖' +

      '</a>';



      result.appendChild(
        card
      );

    }
  );



  if(list.length > 300){

    result.insertAdjacentHTML(

      "beforeend",

      '<div class="box">' +

      '符合條件共有 ' +

      list.length +

      ' 筆，目前先顯示最新排序的前 300 筆。' +

      '</div>'

    );

  }

}



document
.getElementById("reload")
.addEventListener(
  "click",
  load
);


document
.getElementById("search")
.addEventListener(
  "input",
  render
);


document
.getElementById("type")
.addEventListener(
  "change",
  render
);


document
.getElementById("age")
.addEventListener(
  "change",
  render
);


document
.getElementById("sort")
.addEventListener(
  "change",
  render
);


document
.getElementById("join")
.addEventListener(
  "change",
  render
);


/*
開啟網站後自動抓取
*/

load();


</script>

</body>
</html>
