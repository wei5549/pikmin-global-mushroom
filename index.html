* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d10;
  color: #f5f7fa;
  font-family: Arial, "Noto Sans TC", sans-serif;
}

main {
  max-width: 980px;
  margin: auto;
  padding: 22px 16px 60px;
}

h1 {
  font-size: 34px;
  margin: 10px 0;
}

.desc {
  color: #9ca3af;
  line-height: 1.6;
  margin-bottom: 20px;
}

.panel {
  background: #15191f;
  border: 1px solid #2a313b;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

input,
select,
button {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #343c48;
  background: #10141a;
  color: white;
  font-size: 16px;
}

button {
  background: #1976d2;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 15px;
}
