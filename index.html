<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wei</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0d1117;color:#fff;
  font-family:Arial,"Noto Sans TC",sans-serif
}
main{max-width:900px;margin:auto;padding:16px}
h1{margin:5px 0;font-size:30px}
.sub{color:#9da7b3;line-height:1.6;margin:10px 0 16px}
.box,.card{
  background:#161b22;border:1px solid #30363d;
  border-radius:12px;padding:14px;margin-bottom:12px
}
input,select,button{
  width:100%;padding:12px;margin:5px 0;
  border-radius:9px;border:1px solid #444;
  background:#0d1117;color:white;font-size:16px
}
button{background:#1976d2;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.check{display:flex;align-items:center;gap:8px;margin:12px 0}
.check input{width:auto}
#status{color:#bbb;line-height:1.6;margin-top:10px}
.summary{font-weight:bold;font-size:18px}
.card.level4{border-color:#d29922}
.card.copied-card{
  border:2px solid #2ea043;background:#111b15
}
.levelBadge{
  display:inline-block;padding:5px 9px;
  background:#253040;border-radius:7px;font-size:14px
}
.level4 .levelBadge{background:#493b16;color:#ffd866}
.name{font-size:22px;font-weight:bold;margin:10px 0}
.level4 .name{color:#ffd866}
.copied-mark{
  display:inline-block;padding:7px 10px;
  background:#17351f;color:#79e08f;
  border:1px solid #2ea043;border-radius:8px;
  font-weight:bold;margin-bottom:8px
}
.people{
  padding:11px;background:#222b36;border-radius:9px;
  font-size:18px;font-weight:bold;margin:10px 0
}
.people.zero{background:#17351f}
.info{margin:8px 0;line-height:1.5;overflow-wrap:anywhere}
.fresh{color:#79e08f}
.old{color:#ffb454}
.veryold{color:#ff7b72}
.warning{
  background:#352a16;color:#ffd27a;
  padding:9px;border-radius:8px;margin-top:9px
}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a,.actions button{
  flex:1;min-width:0;padding:12px 6px;
  margin:0;text-align:center;border-radius:8px;
  color:white;text-decoration:none;font-size:14px;font-weight:bold
}
.map{background:#1976d2}
.copy{background:#238636}
.copy.already{background:#8957e5}
.clear-copy{background:#8b2d2d}
.copy-count{color:#79e08f;margin:8px 0}
.small{color:#9da7b3;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>wei</h1>
<div class="sub">
全球皮克敏找菇｜Level 3、Level 4<br>
使用公開掃描紀錄，戰鬥人數不保證即時。
</div>

<div class="box">
<select id="region">
<option value="">🌏 全球</option>
<optgroup label="亞洲">
<option value="india">🇮🇳 印度</option>
<option value="vietnam">🇻🇳 越南</option>
<option value="indonesia">🇮🇩 印尼</option>
<option value="philippines">🇵🇭 菲律賓</option>
<option value="malaysia">🇲🇾 馬來西亞</option>
<option value="singapore">🇸🇬 新加坡</option>
<option value="thailand">🇹🇭 泰國</option>
</optgroup>
<optgroup label="中東">
<option value="uae">🇦🇪 阿聯</option>
<option value="saudi">🇸🇦 沙烏地</option>
<option value="qatar">🇶🇦 卡達</option>
<option value="kuwait">🇰🇼 科威特</option>
<option value="bahrain">🇧🇭 巴林</option>
<option value="oman">🇴🇲 阿曼</option>
</optgroup>
<optgroup label="大洋洲">
<option value="australia">🇦🇺 澳洲</option>
<option value="newzealand">🇳🇿 紐西蘭</option>
</optgroup>
<optgroup label="北美">
<option value="usa">🇺🇸 美國</option>
<option value="canada">🇨🇦 加拿大</option>
</optgroup>
</select>

<input id="search" placeholder="🔎 搜尋國家、城市">

<select id="level">
<option value="">🍄 Level 3 + Level 4</option>
<option value="3">🍄 只看 Level 3</option>
<option value="4">⭐ 只看 Level 4</option>
</select>

<select id="type">
<option value="">🍄 全部種類</option>
</select>

<select id="age">
<option value="0">🕒 全部掃描時間</option>
<option value="10">10 分鐘內</option>
<option value="30">30 分鐘內</option>
<option value="60">1 小時內</option>
<option value="180">3 小時內</option>
<option value="1440">24 小時內</option>
</select>

<select id="peopleFilter">
<option value="all">👥 全部人數</option>
<option value="zero">👤 只看 0 人</option>
<option value="under5">👥 低於 5 人（0～4）</option>
</select>

<select id="sort">
<option value="new">🕒 最新掃描時間</option>
<option value="least">👥 人數最少</option>
<option value="most">👥 人數最多</option>
<option value="uncopied">📋 未複製優先</option>
</select>

<label class="check">
<input id="join" type="checkbox" checked>
只顯示最後掃描時可加入
</label>

<label class="check">
<input id="hideCopied" type="checkbox">
隱藏已複製過的座標
</label>

<button id="reload">🔄 重新抓取資料</button>
<div id="copyCount" class="copy-count"></div>
<button id="clearCopied" class="clear-copy">
🗑 清除已複製記錄
</button>

<div id="status">準備讀取資料...</div>
<div id="diagnostic" class="small"></div>
</div>

<div id="result"></div>
</main>

<script>
"use strict";

const API="https://late-glade-6923.awho86958.workers.dev";
const STORAGE_KEY="wei_pikmin_copied_gps";

const REGIONS={
  india:"68,6,98,36",
  vietnam:"102,8,110,24",
  indonesia:"94,-12,142,7",
  philippines:"116,4,127,22",
  malaysia:"99,0,120,8",
  singapore:"103.5,1.1,104.1,1.6",
  thailand:"97,5,106,21",
  uae:"51,22,57,27",
  saudi:"34,16,56,33",
  qatar:"50.7,24.3,52,26.3",
  kuwait:"46.4,28.3,49,30.3",
  bahrain:"50.3,25.5,50.9,26.5",
  oman:"51.5,16,60,27",
  australia:"112,-44,154,-10",
  newzealand:"165,-48,179,-33",
  usa:"-125,24,-66,50",
  canada:"-141,41,-52,84"
};

const NAMES={
  2:"🔴 紅菇",
  3:"🩶 灰菇",
  5:"🔵 藍菇",
  6:"🟡 黃菇",
  7:"⚪ 白菇",
  8:"🟣 紫菇",
  9:"🌸 粉菇",
  11:"🔥 火菇",
  12:"💧 水菇",
  13:"💎 水晶菇",
  17:"⚡ 電菇",
  18:"☠️ 毒菇",
  19:"🎉 活動菇",
  26:"🧊 冰藍菇"
};

const $=id=>document.getElementById(id);

let mushrooms=[];
let loadVersion=0;
let invalidCount=0;
let scannedCount=0;

function loadCopied(){
  try{
    const a=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    return new Set(Array.isArray(a)?a:[]);
  }catch(e){
    return new Set();
  }
}

let copiedGPS=loadCopied();

function saveCopied(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify([...copiedGPS])
    );
    return true;
  }catch(e){
    return false;
  }
}

function updateCopyCount(){
  $("copyCount").textContent=
    "📋 已記錄 "+copiedGPS.size+" 個複製過的座標";
}

function esc(v){
  const d=document.createElement("div");
  d.textContent=String(v??"");
  return d.innerHTML;
}

function firstValue(...values){
  return values.find(v=>
    v!==undefined &&
    v!==null &&
    v!==""
  );
}

function validNumber(v){
  if(v===null || v===undefined || v==="")return null;
  const n=Number(v);
  return Number.isFinite(n)?n:null;
}

/*
  座標格式修正：
  支援 lat/lng、latitude/longitude、
  location、coordinates、geometry 等格式。

  只有真的讀到合法經緯度才會顯示。
  不把缺少座標的資料轉成 0,0。
*/
function getGPS(x){
  let lat=firstValue(
    x.lat,
    x.latitude,
    x.location_lat,
    x.location_latitude,
    x.location?.lat,
    x.location?.latitude,
    x.position?.lat,
    x.position?.latitude,
    x.coords?.latitude,
    x.coordinate?.latitude,
    x.geometry?.location?.lat
  );

  let lng=firstValue(
    x.lng,
    x.lon,
    x.long,
    x.longitude,
    x.location_lng,
    x.location_lon,
    x.location_longitude,
    x.location?.lng,
    x.location?.lon,
    x.location?.longitude,
    x.position?.lng,
    x.position?.lon,
    x.position?.longitude,
    x.coords?.longitude,
    x.coordinate?.longitude,
    x.geometry?.location?.lng
  );

  const arrays=[
    x.coordinates,
    x.location?.coordinates,
    x.geometry?.coordinates
  ];

  if(
    (lat===undefined || lng===undefined) &&
    arrays.some(Array.isArray)
  ){
    const a=arrays.find(Array.isArray);
    if(a && a.length>=2){
      // GeoJSON 慣例：[經度, 緯度]
      lng=a[0];
      lat=a[1];
    }
  }

  if(
    (lat===undefined || lng===undefined) &&
    typeof x.location==="string"
  ){
    const m=x.location.match(
      /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/
    );
    if(m){
      lat=m[1];
      lng=m[2];
    }
  }

  lat=validNumber(lat);
  lng=validNumber(lng);

  if(lat===null || lng===null)return null;
  if(lat < -90 || lat > 90)return null;
  if(lng < -180 || lng > 180)return null;
  if(lat===0 && lng===0)return null;

  return {
    lat,
    lng,
    text:lat.toFixed(6)+","+lng.toFixed(6)
  };
}

function getLevel(x){
  return Number(firstValue(x.level,x.mushroom_level,x.mushroomLevel));
}

function getType(x){
  return Number(firstValue(x.type,x.mushroom_type,x.mushroomType));
}

function getPeople(x){
  const v=firstValue(
    x.challenger_count,
    x.challengerCount,
    x.participant_count,
    x.participants_count,
    x.participantCount,
    x.participantsCount,
    x.current_participants,
    x.currentParticipants,
    x.joined_participants,
    x.joinedParticipants,
    typeof x.participants==="number"?x.participants:undefined
  );
  return validNumber(v);
}

function getCapacity(x){
  return validNumber(firstValue(
    x.challenger_capacity,
    x.challengerCapacity,
    x.participant_limit,
    x.participants_limit,
    x.participantLimit,
    x.participantsLimit,
    x.max_participants,
    x.maxParticipants,
    x.capacity
  ));
}

function parseTime(v){
  if(v===null || v===undefined || v==="")return 0;

  const n=Number(v);
  if(Number.isFinite(n) && n>0){
    return n<1e11?n*1000:n;
  }

  const d=Date.parse(v);
  return Number.isFinite(d)?d:0;
}

function getScanTime(x){
  return parseTime(firstValue(
    x.participants_verified_at,
    x.participants_updated_at,
    x.verified_at,
    x.last_observed_at,
    x.observed_at,
    x.last_seen,
    x.last_updated_at,
    x.updated_at,
    x.scanned_at,
    x.scan_time,
    x.discovered_at
  ));
}

function getName(x){
  const type=getType(x);
  const level=getLevel(x);

  if(type===19){
    return level===4?"⭐ 巨大活動":"🍄 大活動菇";
  }

  const plain=(NAMES[type]||"未知菇 Type "+type)
    .replace(/^[^\s]+\s/,"");

  return level===4?"⭐ 巨大"+plain:"🍄 大"+plain;
}

function timeText(ms){
  if(!ms)return "未知";
  return new Date(ms).toLocaleString("zh-TW",{hour12:false});
}

function ageMinutes(ms){
  return ms?(Date.now()-ms)/60000:Infinity;
}

function ageText(ms){
  const m=ageMinutes(ms);
  if(!Number.isFinite(m))return "時間未知";
  if(m<1)return "剛剛";
  if(m<60)return Math.floor(m)+" 分鐘前";
  if(m<1440)return Math.floor(m/60)+" 小時前";
  return Math.floor(m/1440)+" 天前";
}

function ageClass(ms){
  const m=ageMinutes(ms);
  return m<=30?"fresh":m<=180?"old":"veryold";
}

function buildTypeMenu(){
  const select=$("type");
  const current=select.value;
  const types=[...new Set(mushrooms.map(getType))]
    .filter(Number.isFinite)
    .sort((a,b)=>a-b);

  select.innerHTML='<option value="">🍄 全部種類</option>';

  for(const t of types){
    const opt=document.createElement("option");
    opt.value=String(t);
    opt.textContent=NAMES[t]||"🍄 Type "+t;
    select.appendChild(opt);
  }

  if([...select.options].some(o=>o.value===current)){
    select.value=current;
  }
}

function updateDiagnostic(){
  $("diagnostic").textContent=
    "原始紀錄："+scannedCount+
    " 筆｜無效或缺少座標："+invalidCount+
    " 筆｜有效 Level 3/4："+mushrooms.length+" 筆";
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const level=$("level").value;
  const type=$("type").value;
  const maxAge=Number($("age").value);
  const peopleFilter=$("peopleFilter").value;
  const sort=$("sort").value;
  const onlyJoinable=$("join").checked;
  const hideCopied=$("hideCopied").checked;

  let list=mushrooms.filter(x=>{
    if(level && String(getLevel(x))!==level)return false;
    if(type && String(getType(x))!==type)return false;

    const text=[
      x.location_country,
      x.country,
      x.location_city,
      x.city,
      x.name,
      getName(x)
    ].filter(Boolean).join(" ").toLowerCase();

    if(q && !text.includes(q))return false;

    if(maxAge>0 && ageMinutes(getScanTime(x))>maxAge){
      return false;
    }

    const people=getPeople(x);
    const capacity=getCapacity(x);

    if(peopleFilter==="zero" && people!==0)return false;
    if(peopleFilter==="under5" &&
       (people===null || people>=5))return false;

    if(onlyJoinable && capacity!==null &&
       people!==null && people>=capacity){
      return false;
    }

    const gps=getGPS(x);
    if(!gps)return false;
    if(hideCopied && copiedGPS.has(gps.text))return false;

    return true;
  });

  list.sort((a,b)=>{
    if(sort==="least"){
      return (getPeople(a)??Infinity)-
             (getPeople(b)??Infinity) ||
             getScanTime(b)-getScanTime(a);
    }
    if(sort==="most"){
      return (getPeople(b)??-1)-
             (getPeople(a)??-1) ||
             getScanTime(b)-getScanTime(a);
    }
    if(sort==="uncopied"){
      const ac=Number(copiedGPS.has(getGPS(a).text));
      const bc=Number(copiedGPS.has(getGPS(b).text));
      return ac-bc || getScanTime(b)-getScanTime(a);
    }
    return getScanTime(b)-getScanTime(a);
  });

  const result=$("result");
  result.innerHTML="";

  const summary=document.createElement("div");
  summary.className="box summary";
  summary.textContent="🍄 目前符合條件："+list.length+" 個";
  result.appendChild(summary);

  if(!list.length){
    const empty=document.createElement("div");
    empty.className="box";
    empty.textContent=
      "目前沒有符合條件且座標有效的蘑菇。"+
      "若上方顯示大量無效座標，可能是 API 資料格式改變。";
    result.appendChild(empty);
    return;
  }

  for(const x of list.slice(0,300)){
    const gps=getGPS(x);
    const copied=copiedGPS.has(gps.text);
    const people=getPeople(x);
    const capacity=getCapacity(x);
    const ms=getScanTime(x);
    const level=getLevel(x);

    const location=[
      x.location_country||x.country,
      x.location_city||x.city
    ].filter(Boolean).join(" ")||"位置未知";

    const peopleText=people===null
      ?"未知"
      :capacity!==null
        ?people+" / "+capacity
        :String(people);

    const card=document.createElement("div");
    card.className="card"+
      (level===4?" level4":"")+
      (copied?" copied-card":"");

    const mapUrl="https://www.google.com/maps?q="+
      encodeURIComponent(gps.text);

    card.innerHTML=`
      <div class="levelBadge">
        ${level===4?"⭐ Level 4 巨大菇":"🍄 Level 3 大菇"}
      </div>
      <div class="name">${esc(getName(x))}</div>
      ${copied?'<div class="copied-mark">✓ 已複製座標</div>':""}
      <div class="people ${people===0?"zero":""}">
        👥 最後掃描戰鬥人數：${esc(peopleText)}
      </div>
      <div class="info">📍 ${esc(location)}</div>
      <div class="info">
        ⚔️ 總戰力：${esc(x.total_power??"未知")}
      </div>
      <div class="info ${ageClass(ms)}">
        🔄 最新掃描時間：${esc(timeText(ms))}
      </div>
      <div class="info ${ageClass(ms)}">
        ⏱️ ${esc(ageText(ms))}
      </div>
      ${ageMinutes(ms)>60
        ?'<div class="warning">⚠️ 掃描超過 1 小時，人數可能已改變。</div>'
        :""}
      <div class="info">📌 GPS：${esc(gps.text)}</div>
      <div class="actions">
        <a class="map" href="${esc(mapUrl)}"
           target="_blank" rel="noopener noreferrer">
          📍 Google 地圖
        </a>
        <button class="copy ${copied?"already":""}"
                type="button">
          ${copied?"✅ 已複製過":"📋 複製座標"}
        </button>
      </div>
    `;

    card.querySelector(".copy").addEventListener("click",async()=>{
      const ok=await copyText(gps.text);

      if(!ok){
        window.prompt("自動複製失敗，請手動複製：",gps.text);
        return;
      }

      copiedGPS.add(gps.text);
      const saved=saveCopied();
      updateCopyCount();

      card.classList.add("copied-card");
      const btn=card.querySelector(".copy");
      btn.classList.add("already");
      btn.textContent="✅ 已複製過";

      if(!card.querySelector(".copied-mark")){
        const mark=document.createElement("div");
        mark.className="copied-mark";
        mark.textContent="✓ 已複製座標";
        card.querySelector(".name").after(mark);
      }

      if(!saved){
        $("status").textContent=
          "⚠️ 已複製成功，但瀏覽器無法永久儲存記錄。";
      }

      if($("hideCopied").checked)render();
    });

    result.appendChild(card);
  }

  if(list.length>300){
    const more=document.createElement("div");
    more.className="box";
    more.textContent=
      "共 "+list.length+" 筆，目前顯示前 300 筆。";
    result.appendChild(more);
  }
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}

  const t=document.createElement("textarea");
  t.value=text;
  t.style.position="fixed";
  t.style.top="0";
  t.style.left="0";
  t.style.opacity="0";
  document.body.appendChild(t);
  t.focus();
  t.select();

  let ok=false;
  try{
    ok=document.execCommand("copy");
  }catch(e){}

  t.remove();
  return ok;
}

async function load(){
  const version=++loadVersion;
  const region=$("region").value;
  const regionName=$("region").selectedOptions[0].textContent;

  $("reload").disabled=true;
  mushrooms=[];
  invalidCount=0;
  scannedCount=0;
  $("result").innerHTML="";
  $("status").textContent="正在抓取 "+regionName+" ...";
  updateDiagnostic();

  const seen=new Set();
  const cursors=new Set();
  let cursor=null;
  let pages=0;

  try{
    while(true){
      if(version!==loadVersion)return;

      const url=new URL(API);
      url.searchParams.set("limit","1000");

      if(region && REGIONS[region]){
        url.searchParams.set("bbox",REGIONS[region]);
      }
      if(cursor)url.searchParams.set("cursor",cursor);

      url.searchParams.set("t",String(Date.now()));

      const response=await fetch(url.toString(),{
        cache:"no-store"
      });

      if(version!==loadVersion)return;

      if(!response.ok){
        throw new Error("HTTP "+response.status);
      }

      const data=await response.json();

      if(!data || data.success!==true){
        throw new Error(data?.error||"API 回傳失敗");
      }

      if(!Array.isArray(data.mushrooms)){
        throw new Error("API 沒有回傳 mushrooms 陣列");
      }

      pages++;

      for(const x of data.mushrooms){
        scannedCount++;

        if(![3,4].includes(getLevel(x)))continue;

        const gps=getGPS(x);

        if(!gps){
          invalidCount++;
          continue;
        }

        const key=String(
          x.id??(
            gps.text+"|"+getType(x)+"|"+getLevel(x)
          )
        );

        if(seen.has(key))continue;
        seen.add(key);
        mushrooms.push(x);
      }

      mushrooms.sort((a,b)=>getScanTime(b)-getScanTime(a));
      buildTypeMenu();
      updateDiagnostic();
      render();

      $("status").textContent=
        "已讀取 "+pages+" 頁｜有效蘑菇 "+
        mushrooms.length+" 個";

      const next=data.next_cursor;

      if(!next || next===cursor || cursors.has(next)){
        break;
      }

      cursors.add(next);
      cursor=next;

      await new Promise(r=>setTimeout(r,150));
    }

    if(version!==loadVersion)return;

    $("status").textContent=
      "✅ 抓取完成："+regionName+
      "｜"+pages+" 頁｜有效蘑菇 "+
      mushrooms.length+" 個";

    if(invalidCount>0){
      $("status").textContent+=
        "｜⚠️ 已排除 "+invalidCount+" 筆無效座標";
    }

  }catch(e){
    if(version!==loadVersion)return;
    $("status").textContent=
      "⚠️ 讀取異常："+e.message+
      "｜已保留 "+mushrooms.length+" 筆有效資料";
  }finally{
    if(version===loadVersion){
      $("reload").disabled=false;
    }
  }
}

$("clearCopied").addEventListener("click",()=>{
  if(!copiedGPS.size)return;
  if(!confirm("確定清除所有已複製座標記錄？"))return;
  copiedGPS.clear();
  saveCopied();
  updateCopyCount();
  render();
});

$("region").addEventListener("change",load);
$("reload").addEventListener("click",load);
$("search").addEventListener("input",render);

for(const id of [
  "level","type","age","peopleFilter",
  "sort","join","hideCopied"
]){
  $(id).addEventListener("change",render);
}

updateCopyCount();
load();
</script>
</body>
</html>
